[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-planning-dependency-capacity-mapper"
version = "0.1.0"
description = "A foundation for dependency, capacity, and risk analysis during Agile planning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "networkx",
    "matplotlib",
    "click",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.scripts]
pi-planning = "cli.init:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "logging_config"]

[tool.setuptools.packages.find]
where = ["src"]
